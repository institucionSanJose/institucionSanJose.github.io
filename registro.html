<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear acceso | Real Colegio San José</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="main">
  <div class="wrap">
    <div class="brand">
      <img src="assets/logo.png" alt="Escudo Real Colegio San José">
      <div class="brand-text">
        <span class="a">Real Colegio</span>
        <span class="b">San José</span>
      </div>
    </div>
    <div class="navlinks"><a href="index.html">Inicio</a></div>
  </div>
</nav>

<section class="section">
  <div class="wrap">
    <div class="auth-box">
      <h2>Crear tu acceso</h2>
      <p class="sub">Solo funciona si un administrador ya te invitó con tu correo.</p>
      <div id="msgArea"></div>
      <form id="formRegistro">
        <div class="field">
          <label for="inpCorreo">Correo institucional (el mismo que te invitaron)</label>
          <input type="email" id="inpCorreo" required placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="field">
          <label for="inpClave">Crea tu contraseña</label>
          <input type="password" id="inpClave" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn dorado" style="width:100%;" id="btnCrear">Crear mi acceso</button>
      </form>
      <p style="text-align:center; margin-top:18px; font-size:.85rem;">
        ¿Ya tienes contraseña? <a href="login.html" style="color:var(--azul); font-weight:700;">Inicia sesión</a>
      </p>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>© Real Colegio San José · Popayán, Cauca</span>
    <span>Sistema de citas institucional</span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('formRegistro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const correo = document.getElementById('inpCorreo').value.trim().toLowerCase();
  const clave = document.getElementById('inpClave').value;
  const btn = document.getElementById('btnCrear');
  const msgArea = document.getElementById('msgArea');
  msgArea.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Verificando invitación...';

  const key = claveDeCorreo(correo);
  let cred = null;
  try {
    btn.textContent = 'Creando cuenta...';
    cred = await auth.createUserWithEmailAndPassword(correo, clave);

    const invDoc = await db.collection('invitaciones').doc(key).get();
    if (!invDoc.exists || invDoc.data().usada) {
      await cred.user.delete().catch(()=>{});
      mostrarError('msgArea', 'No encontramos una invitación pendiente para ese correo. Pide al administrador que te agregue primero.');
      btn.disabled = false; btn.textContent = 'Crear mi acceso';
      return;
    }
    const inv = invDoc.data();

    await db.collection('usuarios').doc(cred.user.uid).set({
      correo: correo,
      rol: inv.rol,
      personaId: inv.personaId || null,
      categoria: inv.categoria || null
    });
    await db.collection('invitaciones').doc(key).update({ usada: true });

    if (inv.rol === 'admin' || inv.rol === 'propietario') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'mi-cuenta.html';
    }
  } catch (err) {
    console.error('ERROR DE REGISTRO:', err);
    mostrarError('msgArea', traducirErrorFirebase(err.code));
    btn.disabled = false; btn.textContent = 'Crear mi acceso';
  }
});
</script>

</body>
</html>
