<script>
document.getElementById('btnOjoClave').addEventListener('click', () => {
  const inp = document.getElementById('inpClave');
  const btn = document.getElementById('btnOjoClave');
  const visible = inp.type === 'text';
  inp.type = visible ? 'password' : 'text';
  btn.textContent = visible ? '👁️' : '🙈';
});

document.getElementById('formRegistro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const correo = document.getElementById('inpCorreo').value.trim().toLowerCase();
  const clave = document.getElementById('inpClave').value;
  const btn = document.getElementById('btnCrear');
  const msgArea = document.getElementById('msgArea');
  msgArea.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Verificando invitación...';

  const key = claveDeCorreo(correo);
  let cred = null;
  try {
    btn.textContent = 'Creando cuenta...';
    cred = await auth.createUserWithEmailAndPassword(correo, clave);

    const invDoc = await db.collection('invitaciones').doc(key).get();
    if (!invDoc.exists || invDoc.data().usada) {
      await cred.user.delete().catch(()=>{});
      mostrarError('msgArea', 'No encontramos una invitación pendiente para ese correo. Pide al administrador que te agregue primero.');
      btn.disabled = false; btn.textContent = 'Crear mi acceso';
      return;
    }
    const inv = invDoc.data();

    await db.collection('usuarios').doc(cred.user.uid).set({
      correo: correo,
      rol: inv.rol,
      personaId: inv.personaId || null,
      categoria: inv.categoria || null
    });
    await db.collection('invitaciones').doc(key).update({ usada: true });

    if (inv.rol === 'admin' || inv.rol === 'propietario') {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'mi-cuenta.html';
    }
  } catch (err) {
    console.error('ERROR DE REGISTRO:', err);
    mostrarError('msgArea', traducirErrorFirebase(err.code));
    btn.disabled = false; btn.textContent = 'Crear mi acceso';
  }
});
</script>
